<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Study Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column. Home is a grid of six zone cards; play view is a single question card with feedback beneath. */
:root{
  --bg:#EBEFF6; --surface:#FFFFFF; --surface2:#F3F6FB; --ink:#101A33; --muted:#556083; --line:#D3DAE8;
  --accent:#2B4EFF; --accent-ink:#FFFFFF; --accent-soft:#E3E9FF;
  --good:#117A58; --good-soft:#DDF3EA; --bad:#C23737; --bad-soft:#FBE4E4; --warn:#9A6A12; --warn-soft:#FBF0D6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1326; --surface:#151D37; --surface2:#1B2544; --ink:#E7ECF9; --muted:#98A4C6; --line:#2A3558;
  --accent:#8199FF; --accent-ink:#0D1326; --accent-soft:#232F5C;
  --good:#42D6A0; --good-soft:#12382F; --bad:#FF8484; --bad-soft:#40202A; --warn:#E9B64E; --warn-soft:#3B2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1326; --surface:#151D37; --surface2:#1B2544; --ink:#E7ECF9; --muted:#98A4C6; --line:#2A3558;
  --accent:#8199FF; --accent-ink:#0D1326; --accent-soft:#232F5C;
  --good:#42D6A0; --good-soft:#12382F; --bad:#FF8484; --bad-soft:#40202A; --warn:#E9B64E; --warn-soft:#3B2F14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.brand .mono{margin-top:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rankbar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.rankrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.rankrow strong{font-family:var(--f-display);font-size:18px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* home */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.zone{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .15s,border-color .15s}
.zone:hover{border-color:var(--accent);transform:translateY(-2px)}
.zone h3{font-size:20px;font-weight:700}
.zone p{margin:0;color:var(--muted);font-size:14px}
.zone .meta{display:flex;justify-content:space-between;gap:8px;margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:16px;text-align:left;display:grid;gap:4px}
.mode.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.mode h3{font-size:19px}
.mode p{margin:0;font-size:14px;opacity:.85}
.mode:disabled{opacity:.5;cursor:not-allowed}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font-size:20px}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0}

/* play */
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.prog{display:flex;align-items:center;gap:10px;flex:1;min-width:140px}
.prog .bar{flex:1}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:99px;padding:3px 10px}
.chip.t-mcq{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.t-short{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.t-essay{background:var(--good-soft);color:var(--good);border-color:transparent}
.qtext{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.3;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;font-weight:500;min-width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.opt span.tx{min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)} .fb.mid{background:var(--warn-soft)}
.fb strong{font-family:var(--f-display);font-size:17px}
.fb p{margin:0}
textarea{width:100%;min-height:150px;resize:vertical;font:inherit;line-height:1.5;background:var(--surface2);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
textarea.long{min-height:300px}
textarea:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--muted);font-size:13px}

/* grading */
.grade{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:16px}
.gh{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{width:84px;height:84px;flex:none}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.ring .bgc{stroke:var(--surface2)}
.rub{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rub li{display:flex;gap:10px;align-items:flex-start}
.rub .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.rub .y .m{background:var(--good-soft);color:var(--good)}
.rub .n .m{background:var(--bad-soft);color:var(--bad)}
.rub .n{color:var(--muted)}
.model{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.model summary{cursor:pointer;font-weight:600}
.model p{margin:8px 0 0;white-space:pre-wrap}
.src{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.imp{margin:0;padding-left:18px;display:grid;gap:4px}

/* results */
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.res h2{font-size:28px}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.zrow .bar{grid-column:1 / -1}

/* nav */
.nav{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;max-width:100%}
.nav button{background:none;border:0;border-radius:7px;padding:7px 14px;font-weight:500;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
/* figures */
.fig{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.fig svg{width:100%;height:auto;max-width:520px;display:block;margin:0 auto}
.fig figcaption{font-size:13px;color:var(--muted);text-align:center}
.fig figcaption b{color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gallery .fig{background:var(--surface)}
/* progress */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.big{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em}
.card p{margin:0}
.tbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.tbar i{display:block;height:100%}
.tbar .g{background:var(--good)} .tbar .b{background:var(--bad)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--surface2);border:1px solid var(--line)}
.leg .g::before{background:var(--good);border-color:var(--good)} .leg .b::before{background:var(--bad);border-color:var(--bad)}
.trow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow h4{margin:0;font-family:var(--f-display);font-size:16px}
.trow .sub{font-size:12px;color:var(--muted)}
@media (max-width:560px){.trow{grid-template-columns:1fr auto}.trow .tbar{grid-column:1 / -1;order:3}}
.st{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 9px;white-space:nowrap}
.st.strong{background:var(--good-soft);color:var(--good)} .st.shaky{background:var(--warn-soft);color:var(--warn)} .st.weak{background:var(--bad-soft);color:var(--bad)} .st.new{background:var(--surface2);color:var(--muted)}
.small{padding:5px 12px;font-size:13px}
.act{list-style:none;margin:0;padding:0;display:grid}
.act li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.act li:first-child{border-top:0}
.act .m{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.act .y{background:var(--good-soft);color:var(--good)} .act .n{background:var(--bad-soft);color:var(--bad)} .act .p{background:var(--warn-soft);color:var(--warn)}
.act .q{overflow-wrap:anywhere}
.focus{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* learn + exam */
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.cmp th,.cmp td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.cmp th{background:var(--surface2);font-weight:600}
.exam{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:10px 0}
.exam ul,.exam ol{margin:6px 0 0;padding-left:20px}
.flag{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.lsearch{display:grid;gap:6px}
.lsearch input{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.lsearch input:focus{border-color:var(--accent);outline:none}
.chipbtn{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 12px}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.lsec{font-size:18px;margin:18px 0 8px}
.litem{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px}
.litem summary{cursor:pointer;padding:13px 16px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style-position:inside}
.litem[open] summary{border-bottom:1px solid var(--line)}
.rd{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--good-soft);color:var(--good);border-radius:99px;padding:2px 9px;flex:none}
.lbody{padding:14px 16px 16px;display:grid;gap:10px}
.lbody p,.lbody ul,.lbody ol{margin:0}
.lbody ul,.lbody ol{padding-left:22px;display:grid;gap:4px}
.lact{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.btn.small{padding:6px 12px;font-size:13px}
.papers{display:grid;gap:14px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.paper-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.paper-head h2{font-size:28px}
.clock{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:grid;gap:2px;text-align:right}
.clock b{font-family:var(--f-mono);font-size:22px}
.cover{border-collapse:collapse;width:100%;font-size:14px}
.cover th,.cover td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.cover th{background:var(--surface2);width:42%;font-weight:600}
.casebox{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.casebox summary{cursor:pointer;font-weight:600}
.casetext{display:grid;gap:10px;margin-top:10px}
.casetext p{margin:0}
.eq{display:grid;gap:10px;border-top:2px solid var(--line);padding-top:14px}
.eqh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qn{font-family:var(--f-display);font-weight:800;font-size:18px}
.pts{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.pts.good{background:var(--good-soft);color:var(--good)} .pts.mid{background:var(--warn-soft);color:var(--warn)} .pts.bad{background:var(--bad-soft);color:var(--bad)}
.eqt{margin:0}
.match{display:grid;gap:10px}
.mrow{display:grid;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow .quote{margin:0;font-style:italic}
.mrow select{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
.scoretable{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:320px}
.res-q .rub{margin-top:2px}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
